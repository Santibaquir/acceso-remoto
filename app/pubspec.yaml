name: acceso_remoto
description: "App móvil de la central de monitoreo Acceso Remoto"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # Firebase: conexión, sesión anónima, base de datos en tiempo real y push
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_database: ^13.0.1
  firebase_messaging: ^17.0.1

  # Canal de notificaciones con sonido de sirena
  flutter_local_notifications: ^22.3.3
  # Sirena dentro de la app
  audioplayers: ^6.8.1
  # Fechas en español
  intl: ^0.20.3
  # Guardar la app de cámara elegida
  shared_preferences: ^2.5.6
  # Abrir la app de la cámara Wi-Fi
  external_app_launcher: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sonidos/
